<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNJ Distribution Catalogue</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #333;
}

/* ===== ONBOARDING SCREEN ===== */
#welcomeScreen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(to bottom, #2ea3cc, #0f6e8c);
    color: white;
    transition: 0.6s ease;
}

#welcomeScreen img {
    width: 220px; /* resized logo */
    margin-bottom: 20px;
}

#welcomeScreen h1 {
    margin-bottom: 30px;
    font-size: 28px;
}

.category-buttons {
    display: grid;
    grid-template-columns: repeat(3, 180px);
    gap: 15px;
}

.category-buttons button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #0f6e8c;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
}

.category-buttons button:hover {
    background: #dff3fa;
    transform: translateY(-3px);
}

.skip-btn {
    margin-top: 20px;
    background: transparent;
    color: white;
    border: 1px solid white;
}

/* ===== CATALOGUE ===== */
#catalogue {
    display: none;
    padding: 40px;
}

.catalogue-header {
    text-align: center;
    margin-bottom: 30px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    text-align: center;
    transition: 0.3s ease;
}

.product-card:hover {
    transform: translateY(-5px);
}

.product-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 6px;
}

/* Back Button */
.back-btn {
    margin-bottom: 20px;
    padding: 8px 15px;
    border: none;
    background: #0f6e8c;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>
<body>

<!-- ===== WELCOME SCREEN ===== -->
<div id="welcomeScreen">
    <img src="mnj-logo.png" alt="MNJ Logo">
    <h1>Welcome! How may I help you today?</h1>

    <div class="category-buttons">
        <button onclick="filterCategory('Spearguns')">Spearguns</button>
        <button onclick="filterCategory('Gloves')">Gloves</button>
        <button onclick="filterCategory('Snorkels')">Snorkels</button>
        <button onclick="filterCategory('Fins')">Fins</button>
        <button onclick="filterCategory('Misc')">Misc</button>
        <button onclick="filterCategory('All')">View All</button>
    </div>

    <button class="skip-btn" onclick="filterCategory('All')">
        Skip & View All Products
    </button>
</div>

<!-- ===== CATALOGUE SECTION ===== -->
<div id="catalogue">
    <button class="back-btn" onclick="goBack()">← Back</button>

    <div class="catalogue-header">
        <h2 id="categoryTitle">All Products</h2>
    </div>

    <div class="product-grid" id="productGrid">

        <!-- Example Products -->
        <div class="product-card" data-category="Spearguns">
            <img src="speargun1.jpg" alt="">
            <h4>Carbon Speargun</h4>
        </div>

        <div class="product-card" data-category="Gloves">
            <img src="gloves1.jpg" alt="">
            <h4>Diving Gloves</h4>
        </div>

        <div class="product-card" data-category="Snorkels">
            <img src="snorkel1.jpg" alt="">
            <h4>Pro Snorkel</h4>
        </div>

        <div class="product-card" data-category="Fins">
            <img src="fins1.jpg" alt="">
            <h4>Carbon Fins</h4>
        </div>

        <div class="product-card" data-category="Misc">
            <img src="misc1.jpg" alt="">
            <h4>Gear Bag</h4>
        </div>

    </div>
</div>

<script>
function filterCategory(category) {
    document.getElementById("welcomeScreen").style.display = "none";
    document.getElementById("catalogue").style.display = "block";

    const products = document.querySelectorAll(".product-card");
    const title = document.getElementById("categoryTitle");

    if (category === "All") {
        title.textContent = "All Products";
        products.forEach(product => product.style.display = "block");
    } else {
        title.textContent = category;
        products.forEach(product => {
            product.style.display =
                product.dataset.category === category ? "block" : "none";
        });
    }
}

function goBack() {
    document.getElementById("catalogue").style.display = "none";
    document.getElementById("welcomeScreen").style.display = "flex";
}
</script>

</body>
</html>
