<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Abyss Spearfishing Catalogue</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#060a10;
--card:#0d1620;
--primary:#00d8d6;
--text:#e7f7f5;
--border:#1b2533;
}

*{box-sizing:border-box}
body{
margin:0;
font-family:Inter, sans-serif;
background:radial-gradient(circle at top,#0b1724,#020309);
color:var(--text);
}

.page{
max-width:1100px;
margin:auto;
padding:20px;
}

h1,h2,h3{font-family:"Playfair Display",serif;margin:0}

button{cursor:pointer;font-family:inherit}

/* NAV */
.nav{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
letter-spacing:.2em;
text-transform:uppercase;
}

.cart-btn{
background:var(--card);
border:1px solid var(--border);
padding:6px 14px;
border-radius:999px;
color:var(--text);
}

/* LANDING */
.landing{display:none}
.landing.active{display:block}

.category-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:16px;
margin-top:30px;
}

.category-card{
background:linear-gradient(135deg,#0a1420,#050b13);
border:1px solid var(--border);
padding:30px 20px;
text-align:center;
border-radius:18px;
font-weight:600;
letter-spacing:.1em;
text-transform:uppercase;
transition:.2s;
}

.category-card:hover{
transform:translateY(-5px);
border-color:var(--primary);
}

/* PRODUCTS */
.products{display:none}
.products.active{display:block}

.filter-row{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:20px;
}

.filter-btn{
background:#091320;
border:1px solid var(--border);
padding:6px 10px;
border-radius:999px;
font-size:12px;
color:var(--text);
}

.filter-btn.active{
background:var(--primary);
color:#041014;
border:none;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:16px;
}

.card{
background:#0a1420;
border:1px solid var(--border);
border-radius:16px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:170px;
object-fit:cover;
}

.card-body{
padding:12px;
}

.price{
color:var(--primary);
font-weight:600;
}

/* SIMPLE DIALOG */
.dialog{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.dialog.active{display:flex}

.dialog-box{
background:#050b13;
border-radius:18px;
max-width:500px;
width:100%;
padding:20px;
}

.dialog-box img{
width:100%;
border-radius:12px;
margin-bottom:10px;
}
</style>
</head>

<body>
<div class="page">

<header class="nav">
<div class="logo">Abyss</div>
<button class="cart-btn">Mock Catalogue</button>
</header>

<!-- LANDING -->
<section class="landing active" id="landing">
<h1>Select Your Gear Category</h1>

<div class="category-grid" id="categoryGrid"></div>
</section>

<!-- PRODUCTS -->
<section class="products" id="products">
<h2>Gear Catalogue</h2>
<div class="filter-row" id="filters"></div>
<div class="grid" id="productGrid"></div>
</section>

</div>

<!-- DIALOG -->
<div class="dialog" id="dialog">
<div class="dialog-box">
<img id="dialogImg">
<h3 id="dialogTitle"></h3>
<p class="price" id="dialogPrice"></p>
<p>Premium quality spearfishing equipment built for serious divers.</p>
<br>
<button onclick="closeDialog()">Close</button>
</div>
</div>

<script>

/* =========================
   DATA
========================= */

const CATEGORIES = [
"Spearguns",
"Gloves",
"Snorkels",
"Fins",
"Misc"
];

const PRODUCTS = [
{
id:"s1",
name:"Carbon Elite 110",
price:545,
category:"Spearguns",
image:"https://images.unsplash.com/photo-1544551763-47a0160c9e5d?q=80&w=800"
},
{
id:"s2",
name:"Wood Roller Gun",
price:720,
category:"Spearguns",
image:"https://images.unsplash.com/photo-1616423641454-ee09083e9573?q=80&w=800"
},
{
id:"g1",
name:"Reinforced Dive Gloves",
price:45,
category:"Gloves",
image:"https://images.unsplash.com/photo-1604335399105-a0c6f8a9c5f5?q=80&w=800"
},
{
id:"sn1",
name:"Low Drag Snorkel",
price:35,
category:"Snorkels",
image:"https://images.unsplash.com/photo-1582967788600-4740236a2818?q=80&w=800"
},
{
id:"f1",
name:"Carbon Long Fins",
price:420,
category:"Fins",
image:"https://images.unsplash.com/photo-1516939884455-1445c8652f83?q=80&w=800"
},
{
id:"m1",
name:"Float Line Set",
price:60,
category:"Misc",
image:"https://images.unsplash.com/photo-1583212292454-1fe6229603b7?q=80&w=800"
}
];

/* =========================
   STATE
========================= */

let selectedCategory = null;

/* =========================
   INIT
========================= */

const landing = document.getElementById("landing");
const products = document.getElementById("products");
const categoryGrid = document.getElementById("categoryGrid");
const filters = document.getElementById("filters");
const productGrid = document.getElementById("productGrid");

/* =========================
   FUNCTIONS
========================= */

function showProducts(){
landing.classList.remove("active");
products.classList.add("active");
}

function renderCategories(){
CATEGORIES.forEach(cat=>{
const div=document.createElement("div");
div.className="category-card";
div.textContent=cat;
div.onclick=()=>{
selectedCategory=cat;
updateURL();
showProducts();
renderFilters();
renderProducts();
};
categoryGrid.appendChild(div);
});
}

function renderFilters(){
filters.innerHTML="";

const allBtn=document.createElement("button");
allBtn.textContent="All";
allBtn.className="filter-btn"+(!selectedCategory?" active":"");
allBtn.onclick=()=>{
selectedCategory=null;
updateURL();
renderFilters();
renderProducts();
};
filters.appendChild(allBtn);

CATEGORIES.forEach(cat=>{
const btn=document.createElement("button");
btn.textContent=cat;
btn.className="filter-btn"+(selectedCategory===cat?" active":"");
btn.onclick=()=>{
selectedCategory=cat;
updateURL();
renderFilters();
renderProducts();
};
filters.appendChild(btn);
});
}

function renderProducts(){
productGrid.innerHTML="";
let list=PRODUCTS;
if(selectedCategory){
list=PRODUCTS.filter(p=>p.category===selectedCategory);
}

list.forEach(p=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<img src="${p.image}">
<div class="card-body">
<div>${p.name}</div>
<div class="price">₱${p.price.toFixed(2)}</div>
</div>
`;
card.onclick=()=>openDialog(p);
productGrid.appendChild(card);
});
}

function openDialog(product){
document.getElementById("dialog").classList.add("active");
document.getElementById("dialogImg").src=product.image;
document.getElementById("dialogTitle").textContent=product.name;
document.getElementById("dialogPrice").textContent="₱"+product.price.toFixed(2);
}

function closeDialog(){
document.getElementById("dialog").classList.remove("active");
}

function updateURL(){
if(selectedCategory){
history.replaceState(null,null,"?category="+encodeURIComponent(selectedCategory));
}else{
history.replaceState(null,null,window.location.pathname);
}
}

function loadFromURL(){
const params=new URLSearchParams(window.location.search);
const cat=params.get("category");
if(cat && CATEGORIES.includes(cat)){
selectedCategory=cat;
showProducts();
renderFilters();
renderProducts();
}
}

/* =========================
   START
========================= */

renderCategories();
renderFilters();
renderProducts();
loadFromURL();

</script>
</body>
</html>
